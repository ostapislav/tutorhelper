plugins {
    id 'java'
    id 'org.springframework.boot' version "3.2.5"
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'by.ostapislav'
version = '0.0.1-SNAPSHOT'
description = 'TutorHelper'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


repositories {
    mavenCentral()
    maven { url = "https://repo.maven.apache.org/maven2/" }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // 1. Core QueryDSL Dependencies
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:5.3:jakarta'

    // 2. Annotation Processor for generating Q-classes
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:5.3:jakarta'

    // 3. Explicitly add Jakarta persistence definitions if missing
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Lombok
    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'



    // Тесты
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
clean {
    delete 'build/generated/sources/annotationProcessor'
}
tasks.named('test') {
    useJUnitPlatform()
}
